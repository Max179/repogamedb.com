<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 200" width="980" height="200" role="img" aria-label="The multipliers a vehicle can be given">
  <rect width="980" height="200" fill="#12141a"/>
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#8ecbff"/></marker></defs>
  <rect x="20" y="40" width="300" height="60" rx="12" fill="#1b1f27" stroke="#2a2f3a"/>
  <text x="38" y="76" fill="#e8e8e8" font-family="system-ui,sans-serif" font-size="15">Bumpers: more force</text>
  <rect x="340" y="40" width="300" height="60" rx="12" fill="#1b1f27" stroke="#2a2f3a"/>
  <text x="358" y="76" fill="#e8e8e8" font-family="system-ui,sans-serif" font-size="15">A side tackle: its own value</text>
  <rect x="660" y="40" width="300" height="60" rx="12" fill="#1b1f27" stroke="#2a2f3a"/>
  <text x="678" y="76" fill="#e8e8e8" font-family="system-ui,sans-serif" font-size="15">Behind: a catch-up value</text>
  <rect x="20" y="120" width="940" height="56" rx="12" fill="#1b1f27" stroke="#2a2f3a"/>
  <text x="38" y="154" fill="#e8e8e8" font-family="system-ui,sans-serif" font-size="15">Each is a setting on the vehicle, not a rule of the room</text>
</svg>
