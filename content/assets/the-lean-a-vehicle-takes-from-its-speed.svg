<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 200" width="980" height="200" role="img" aria-label="The lean a vehicle takes from its speed">
  <rect width="980" height="200" fill="#12141a"/>
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#8ecbff"/></marker></defs>
  <rect x="20" y="40" width="300" height="60" rx="12" fill="#1b1f27" stroke="#2a2f3a"/>
  <text x="38" y="76" fill="#e8e8e8" font-family="system-ui,sans-serif" font-size="15">Accelerate: the nose lifts</text>
  <rect x="340" y="40" width="300" height="60" rx="12" fill="#1b1f27" stroke="#2a2f3a"/>
  <text x="358" y="76" fill="#e8e8e8" font-family="system-ui,sans-serif" font-size="15">Slow or hit: the nose drops</text>
  <rect x="660" y="40" width="300" height="60" rx="12" fill="#1b1f27" stroke="#2a2f3a"/>
  <text x="678" y="76" fill="#e8e8e8" font-family="system-ui,sans-serif" font-size="15">Each direction has a maximum</text>
  <rect x="20" y="120" width="460" height="56" rx="12" fill="#1b1f27" stroke="#2a2f3a"/>
  <text x="38" y="154" fill="#e8e8e8" font-family="system-ui,sans-serif" font-size="15">The lean is smoothed over its own time</text>
  <rect x="500" y="120" width="460" height="56" rx="12" fill="#1b1f27" stroke="#2a2f3a"/>
  <text x="518" y="154" fill="#e8e8e8" font-family="system-ui,sans-serif" font-size="15">Turning pitches the body as well</text>
</svg>
